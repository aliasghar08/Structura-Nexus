services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: structura-nexus-api:latest
    container_name: structura-nexus-api
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: structura-nexus-web:latest
    container_name: structura-nexus-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

