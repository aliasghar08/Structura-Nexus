  <script>
    console.log(
      "%c Structura Nexus © Ali Asghar · aliasgharinnocent@yahoo.com %c All Rights Reserved · DMCA Protected",

    );

    };

    // Ensure stale service workers and old cached bundles are immediately purged
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
  </script>
